name: Make redirects
on:
  push:
    paths: ['.github/workflows/redirect.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the old site with redirects
        run: |
          set -e
          NEW=https://williamotterson.github.io
          pages=$(git ls-files '*.html')
          git rm -q -r --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          for p in $pages; do
            mkdir -p "$(dirname "$p")"
            url="$NEW/$p"
            [ "$p" = index.html ] && url="$NEW/"
            [ "$p" = de/index.html ] && url="$NEW/de/index.html"
            printf '<!doctype html><meta charset="utf-8"><title>Moved</title><link rel="canonical" href="%s"><meta http-equiv="refresh" content="0; url=%s"><script>location.replace("%s"+location.hash)</script><p>This page moved to <a href="%s">%s</a>.</p>\n' "$url" "$url" "$url" "$url" "$url" > "$p"
          done
          printf '<!doctype html><meta charset="utf-8"><title>Moved</title><script>var p=location.pathname;location.replace((p.toLowerCase().indexOf("/nternet-link")===0?"https://nspired-hackers.github.io":"%s")+p+location.search+location.hash)</script><p>This site moved to <a href="%s/">%s</a>.</p>\n' "$NEW" "$NEW" "$NEW" > 404.html
          printf 'Moved to https://williamotterson.github.io\n' > README.md
          git add -A
          git config user.name "OtterCad"
          git config user.email "immlglolboi@gmail.com"
          git commit -q -m "Site moved: redirect every page"
          git push
